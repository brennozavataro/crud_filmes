<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link rel="stylesheet" href="cadastrar.css">

    <title>Cadastrar Filme</title>
</head>

<body>

    <header>

        <div class="header-content">

            <a
                class="back-link"
                href="../index.html"
            >
                <span>←</span>

                Voltar para a lista
            </a>


            <div class="header-title">

                <span class="eyebrow">
                    CATÁLOGO
                </span>

                <h1>
                    Cadastrar novo filme
                </h1>

                <p>
                    Adicione um novo título à sua coleção.
                </p>

            </div>

        </div>

    </header>


    <main>

        <div class="form-card">

            <div class="form-header">

                <span class="section-label">
                    NOVO FILME
                </span>

                <h2>
                    Informações do filme
                </h2>

            </div>


            <form>

                <div class="input-group">

                    <label for="name">
                        Título
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Digite o título"
                    >

                </div>


                <div class="input-group">

                    <label for="genre">
                        Gênero
                    </label>

                    <input
                        type="text"
                        id="genre"
                        placeholder="Digite o gênero"
                    >

                </div>


                <div class="form-row">

                    <div class="input-group">

                        <label for="ageRating">
                            Classificação indicativa
                        </label>

                        <input
                            type="number"
                            id="ageRating"
                            placeholder="Ex.: 16"
                        >

                    </div>


                    <div class="input-group">

                        <label for="duration">
                            Duração
                        </label>

                        <input
                            type="number"
                            id="duration"
                            placeholder="Em minutos"
                        >

                    </div>

                </div>

            </form>


            <button type="button">
                Cadastrar filme
            </button>

        </div>

    </main>


    <script src="./cadastrar.js"></script>

</body>

</html>
